<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Future Cities | Official Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ===== 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            color: #1f2937;
            background-color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* ===== 公共容器 ===== */
        .container {
            width: 1200px;
            max-width: 90%;
            margin: 0 auto;
        }

        /* ===== 头部导航 ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav ul {
            list-style: none;
            display: flex;
            gap: 32px;
            font-size: 15px;
            color: #374151;
        }

        .nav ul li:hover {
            color: #2563eb;
        }

        /* ===== Hero 区 ===== */
        .hero {
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e3a8a 50%,
                #2563eb 100%
            );
            color: #ffffff;
            padding: 120px 0 100px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            max-width: 720px;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        .hero p {
            font-size: 18px;
            max-width: 640px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
        }

        .btn-primary {
            padding: 14px 32px;
            background: #ffffff;
            color: #1e3a8a;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #e5e7eb;
        }

        .btn-secondary {
            padding: 14px 32px;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        /* ===== 核心板块 ===== */
        section {
            padding: 96px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 64px;
        }

        .section-title h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .section-title p {
            color: #6b7280;
            max-width: 680px;
            margin: 0 auto;
        }

        /* ===== 卡片布局 ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 40px 32px;
            transition: all 0.3s;
            background: #ffffff;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .card p {
            color: #6b7280;
            font-size: 15px;
        }

        /* ===== 数据展示 ===== */
        .stats {
            background: #f9fafb;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 32px;
            text-align: center;
        }

        .stat h4 {
            font-size: 40px;
            font-weight: 700;
            color: #1e3a8a;
        }

        .stat span {
            color: #6b7280;
            font-size: 15px;
        }

        /* ===== 页脚 ===== */
        footer {
            background: #0f172a;
            color: #9ca3af;
            padding: 64px 0 32px;
        }

        footer .footer-top {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 48px;
            margin-bottom: 40px;
        }

        footer h5 {
            color: #ffffff;
            margin-bottom: 16px;
            font-size: 16px;
        }

        footer ul {
            list-style: none;
            font-size: 14px;
        }
